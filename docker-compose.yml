services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexara
      POSTGRES_PASSWORD: nexara
      POSTGRES_DB: nexara_food
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexara -d nexara_food"]
      interval: 2s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://nexara:nexara@postgres:5432/nexara_food?sslmode=disable
      SERVER_PORT: "8080"
      SERVER_READ_TIMEOUT: 15s
      SERVER_WRITE_TIMEOUT: 15s
      ALLOWED_ORIGINS: http://localhost:3000
      JWT_SECRET: change-me-in-production-use-a-strong-random-secret
      JWT_EXPIRY_MINUTES: "60"
      JWT_REFRESH_EXPIRY_DAYS: "7"
      BCRYPT_COST: "12"
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: air

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
